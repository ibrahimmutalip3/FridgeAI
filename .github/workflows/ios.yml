name: iOS Build (Unsigned)

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Show environment information
      - name: Flutter doctor
        run: flutter doctor -v

      # 4. Clean old generated files
      - name: Clean project
        working-directory: fridge_ai
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool
          rm -rf ios/Pods
          rm -rf ios/.symlinks

      # 5. Install Flutter dependencies
      - name: Install dependencies
        working-directory: fridge_ai
        run: flutter pub get

      # 6. Generate launcher icons
      - name: Generate launcher icons
        working-directory: fridge_ai
        run: dart run flutter_launcher_icons

      # 7. Install iOS CocoaPods dependencies
      - name: Install CocoaPods dependencies
        working-directory: fridge_ai/ios
        run: |
          pod install --repo-update

      # 8. Build unsigned iOS application
      - name: Build unsigned iOS app
        working-directory: fridge_ai
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "Starting Flutter iOS build"
          echo "========================================"

          flutter build ios \
            --release \
            --no-codesign \
            -v \
            --dart-define=GROQ_API_KEY="$GROQ_API_KEY" \
            --dart-define=UNSPLASH_ACCESS_KEY="$UNSPLASH_ACCESS_KEY" \
            2>&1 | tee build_ios.log

          echo "========================================"
          echo "Flutter iOS build finished successfully"
          echo "========================================"

      # 9. Check that Runner.app was created
      - name: Check build output
        working-directory: fridge_ai
        run: |
          echo "Checking iOS build output..."

          ls -lah build/ios/iphoneos/

          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not created!"
            exit 1
          fi

          echo "Runner.app found successfully!"

      # 10. Create unsigned IPA
      - name: Package unsigned IPA
        working-directory: fridge_ai
        run: |
          set -e

          BUILD_DIR="build/ios/iphoneos"
          IPA_NAME="FridgeAI-unsigned.ipa"

          echo "Removing old Payload folder..."
          rm -rf "$BUILD_DIR/Payload"

          echo "Creating Payload folder..."
          mkdir -p "$BUILD_DIR/Payload"

          echo "Copying Runner.app..."
          cp -R \
            "$BUILD_DIR/Runner.app" \
            "$BUILD_DIR/Payload/Runner.app"

          echo "Creating IPA..."

          cd "$BUILD_DIR"

          rm -f "$IPA_NAME"

          zip -r -y \
            "$IPA_NAME" \
            Payload

          echo "========================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh "$IPA_NAME"

      # 11. Upload IPA to GitHub Actions artifacts
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FridgeAI-unsigned-ipa
          path: fridge_ai/build/ios/iphoneos/FridgeAI-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
