name: iOS Build (Unsigned)

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      # Pinned to an exact version (rather than just `channel: stable`) so a
      # new Flutter stable release can't silently change build behavior/
      # requirements (e.g. Flutter 3.47 raised the minimum iOS deployment
      # target from 13.0 to 15.0, which broke this workflow when it was
      # tracking `stable` unpinned). Bump deliberately and re-test iOS/
      # Android builds when you want to move to a newer version.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # 3. Show environment information
      - name: Flutter doctor
        run: flutter doctor -v

      # 4. Clean old generated files
      - name: Clean project
        working-directory: fridge_ai
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool
          rm -rf ios/Pods
          rm -rf ios/.symlinks

      # 5. Install Flutter dependencies
      - name: Install dependencies
        working-directory: fridge_ai
        run: flutter pub get

      # 6. Generate launcher icons
      - name: Generate launcher icons
        working-directory: fridge_ai
        run: dart run flutter_launcher_icons

      # 7. Generate iOS platform files (GeneratedPluginRegistrant.swift, the
      # Flutter.podspec, Generated.xcconfig, etc.) explicitly, before running
      # CocoaPods or the full Xcode build.
      #
      # Background: `flutter build ios` normally generates these files itself,
      # via a "Run Script" build phase that Xcode invokes mid-build. In
      # practice that phase can be skipped/reordered by Xcode's dependency
      # analysis, silently leaving `ios/Runner/GeneratedPluginRegistrant.swift`
      # missing on disk even though the Xcode project references it as a
      # source file — which fails the build with:
      #   "error opening input file '.../Runner/GeneratedPluginRegistrant.swift'
      #    (No such file or directory)"
      # Running `--config-only` first forces Flutter's own build system
      # (rather than Xcode) to generate that file up front, so it's
      # guaranteed to exist by the time Xcode compiles Runner.
      - name: Generate iOS platform files
        working-directory: fridge_ai
        run: |
          flutter build ios --release --no-codesign --config-only -v
          echo "Verifying GeneratedPluginRegistrant.swift was created..."
          test -f ios/Runner/GeneratedPluginRegistrant.swift
          echo "OK: $(wc -l < ios/Runner/GeneratedPluginRegistrant.swift) lines"

      # 8. Install iOS CocoaPods dependencies
      - name: Install CocoaPods dependencies
        working-directory: fridge_ai/ios
        run: |
          pod install --repo-update

      # 9. Build unsigned iOS application
      - name: Build unsigned iOS app
        working-directory: fridge_ai
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "Starting Flutter iOS build"
          echo "========================================"

          flutter build ios \
            --release \
            --no-codesign \
            -v \
            --dart-define=GROQ_API_KEY="$GROQ_API_KEY" \
            --dart-define=UNSPLASH_ACCESS_KEY="$UNSPLASH_ACCESS_KEY" \
            2>&1 | tee build_ios.log

          echo "========================================"
          echo "Flutter iOS build finished successfully"
          echo "========================================"

      # 10. Check that Runner.app was created
      - name: Check build output
        working-directory: fridge_ai
        run: |
          echo "Checking iOS build output..."

          ls -lah build/ios/iphoneos/

          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not created!"
            exit 1
          fi

          echo "Runner.app found successfully!"

      # 11. Create unsigned IPA
      - name: Package unsigned IPA
        working-directory: fridge_ai
        run: |
          set -e

          BUILD_DIR="build/ios/iphoneos"
          IPA_NAME="FridgeAI-unsigned.ipa"

          echo "Removing old Payload folder..."
          rm -rf "$BUILD_DIR/Payload"

          echo "Creating Payload folder..."
          mkdir -p "$BUILD_DIR/Payload"

          echo "Copying Runner.app..."
          cp -R \
            "$BUILD_DIR/Runner.app" \
            "$BUILD_DIR/Payload/Runner.app"

          echo "Creating IPA..."

          cd "$BUILD_DIR"

          rm -f "$IPA_NAME"

          zip -r -y \
            "$IPA_NAME" \
            Payload

          echo "========================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh "$IPA_NAME"

      # 12. Upload IPA to GitHub Actions artifacts
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FridgeAI-unsigned-ipa
          path: fridge_ai/build/ios/iphoneos/FridgeAI-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
