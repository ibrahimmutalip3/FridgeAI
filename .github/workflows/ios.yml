name: iOS Build (Unsigned)

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      # Pinned to an exact version (rather than just `channel: stable`) so a
      # new Flutter stable release can't silently change build behavior/
      # requirements (e.g. Flutter 3.47 raised the minimum iOS deployment
      # target from 13.0 to 15.0, which broke this workflow when it was
      # tracking `stable` unpinned). Bump deliberately and re-test iOS/
      # Android builds when you want to move to a newer version.
      #
      # NOTE: this project's ios/Runner.xcodeproj was previously edited (by
      # hand or by a bad automated "fix") to reference a
      # GeneratedPluginRegistrant.swift file. That file has never existed in
      # any stable Flutter release for a normal (non-module) iOS app -
      # flutter_tools has always generated GeneratedPluginRegistrant.h/.m
      # (Objective-C) and wired them in through Runner-Bridging-Header.h,
      # even for apps whose AppDelegate is written in Swift. That was the
      # actual cause of the "iOS IPA build" job failing, not a Flutter
      # version issue or a flutter_tools plugin-injection bug. The .pbxproj
      # and bridging header have been fixed to reference the real .h/.m
      # files, so there is no known reason to avoid 3.47.x+ here anymore -
      # feel free to bump this once it's convenient to re-test.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      # 3. Show environment information
      - name: Flutter doctor
        run: flutter doctor -v

      # 4. Clean old generated files
      - name: Clean project
        working-directory: fridge_ai
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool
          rm -rf ios/Pods
          rm -rf ios/.symlinks

      # 5. Install Flutter dependencies
      - name: Install dependencies
        working-directory: fridge_ai
        run: flutter pub get

      # 5b. Sanity check: make sure flutter_tools actually wrote the plugin
      # registrant files that Runner.xcodeproj compiles
      # (ios/Runner/GeneratedPluginRegistrant.h + .m, wired in via
      # Runner-Bridging-Header.h). This is a plain existence check, not a
      # workaround - if these are ever missing after `flutter pub get` it
      # means the ios/ project itself is misconfigured (e.g. no plugins with
      # iOS support in pubspec.yaml, or a corrupted checkout), and failing
      # fast here with a clear message is more useful than letting Xcode
      # fail deep into the build with a confusing "no such file" error.
      - name: Ensure plugin registrant exists
        working-directory: fridge_ai
        run: |
          HEADER="ios/Runner/GeneratedPluginRegistrant.h"
          IMPL="ios/Runner/GeneratedPluginRegistrant.m"

          if [ -f "$HEADER" ] && [ -f "$IMPL" ]; then
            echo "OK: $HEADER and $IMPL present after 'flutter pub get'."
            exit 0
          fi

          echo "ERROR: $HEADER and/or $IMPL missing after 'flutter pub get'."
          echo "These files are required for the Xcode build to compile Runner."
          echo "Check that pubspec.yaml has plugins with iOS support and that ios/ wasn't corrupted."
          exit 1

      # 6. Generate launcher icons
      - name: Generate launcher icons
        working-directory: fridge_ai
        run: dart run flutter_launcher_icons

      # NOTE: There is deliberately no separate "pod install" step here.
      # `flutter build ios` below runs CocoaPods integration itself, at the
      # point where Flutter has fully finished writing
      # ios/Flutter/Generated.xcconfig and the plugin list CocoaPods reads
      # via `flutter_install_all_ios_pods` in the Podfile. Running
      # `pod install` manually as an earlier, separate step raced against
      # that and intermittently produced an incomplete Pods install (e.g.
      # missing path_provider_foundation), causing
      # "no such module 'path_provider_foundation'" in
      # GeneratedPluginRegistrant.m even though `flutter pub get`
      # resolved the package correctly. Let `flutter build ios` own the
      # entire pod install step instead of pre-empting it.

      # 7. Build unsigned iOS application
      - name: Build unsigned iOS app
        working-directory: fridge_ai
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "Starting Flutter iOS build"
          echo "========================================"

          flutter build ios \
            --release \
            --no-codesign \
            -v \
            --dart-define=GROQ_API_KEY="$GROQ_API_KEY" \
            --dart-define=UNSPLASH_ACCESS_KEY="$UNSPLASH_ACCESS_KEY" \
            2>&1 | tee build_ios.log

          echo "========================================"
          echo "Flutter iOS build finished successfully"
          echo "========================================"

      # 8. Check that Runner.app was created
      - name: Check build output
        working-directory: fridge_ai
        run: |
          echo "Checking iOS build output..."

          ls -lah build/ios/iphoneos/

          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not created!"
            exit 1
          fi

          echo "Runner.app found successfully!"

      # 9. Create unsigned IPA
      - name: Package unsigned IPA
        working-directory: fridge_ai
        run: |
          set -e

          BUILD_DIR="build/ios/iphoneos"
          IPA_NAME="FridgeAI-unsigned.ipa"

          echo "Removing old Payload folder..."
          rm -rf "$BUILD_DIR/Payload"

          echo "Creating Payload folder..."
          mkdir -p "$BUILD_DIR/Payload"

          echo "Copying Runner.app..."
          cp -R \
            "$BUILD_DIR/Runner.app" \
            "$BUILD_DIR/Payload/Runner.app"

          echo "Creating IPA..."

          cd "$BUILD_DIR"

          rm -f "$IPA_NAME"

          zip -r -y \
            "$IPA_NAME" \
            Payload

          echo "========================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh "$IPA_NAME"

      # 10. Upload IPA to GitHub Actions artifacts
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FridgeAI-unsigned-ipa
          path: fridge_ai/build/ios/iphoneos/FridgeAI-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
