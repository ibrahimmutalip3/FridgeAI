name: iOS Build (Unsigned)

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      # Pinned to an exact version (rather than just `channel: stable`) so a
      # new Flutter stable release can't silently change build behavior/
      # requirements (e.g. Flutter 3.47 raised the minimum iOS deployment
      # target from 13.0 to 15.0, which broke this workflow when it was
      # tracking `stable` unpinned). Bump deliberately and re-test iOS/
      # Android builds when you want to move to a newer version.
      #
      # Using 3.44.7 (the previous quarterly release line, not the newest
      # 3.47.x) rather than the latest stable on purpose. 3.47 ships a very
      # new `enable-uiscene-migration` feature that, on this project, was
      # unreliably generating ios/Flutter/GeneratedPluginRegistrant.swift —
      # the build would intermittently fail Xcode compilation with "error
      # opening input file '.../GeneratedPluginRegistrant.swift'" for no
      # code-level reason. 3.44 fully supports the UIScene lifecycle API
      # this project already uses (FlutterImplicitEngineDelegate /
      # FlutterSceneDelegate have existed since Flutter 3.38), just without
      # 3.47's newest and least-battle-tested migration tooling. No changes
      # to AppDelegate.swift or Info.plist are needed for this downgrade.
      # Re-evaluate 3.47.x (or newer) once it has a few more patch releases
      # and the plugin-registrant generation issue is confirmed fixed.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      # 3. Show environment information
      - name: Flutter doctor
        run: flutter doctor -v

      # 4. Clean old generated files
      - name: Clean project
        working-directory: fridge_ai
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool
          rm -rf ios/Pods
          rm -rf ios/.symlinks

      # 5. Install Flutter dependencies
      - name: Install dependencies
        working-directory: fridge_ai
        run: flutter pub get

      # 5b. Work around a real flutter_tools bug (confirmed present in the
      # 3.44.x line, see flutter/flutter#186800 for the Android-side twin of
      # this issue): `injectPlugins()` sometimes decides the iOS Swift plugin
      # registrant is "up to date" and silently skips writing
      # ios/Flutter/GeneratedPluginRegistrant.swift, even though the file
      # doesn't exist yet on a fresh checkout. When that happens, `flutter
      # pub get`'s own log shows the tell:
      #   Skipping generating GeneratedPluginRegistrant.h because it is up-to-date.
      #   Skipping generating GeneratedPluginRegistrant.m because it is up-to-date.
      # ...with the matching ".swift" line simply missing. The Xcode build
      # then fails ~40 seconds in with a confusing "error opening input file
      # '.../GeneratedPluginRegistrant.swift'".
      #
      # Deleting the plugin-tracking state files and re-running `flutter pub
      # get` forces flutter_tools to recompute plugin injection from scratch
      # instead of trusting its (incorrect) up-to-date check, and reliably
      # produces the file. This is cheap (a few seconds) so it's not worth
      # gating on whether the bug actually triggered this run.
      - name: Ensure plugin registrant exists
        working-directory: fridge_ai
        run: |
          REGISTRANT="ios/Flutter/GeneratedPluginRegistrant.swift"

          if [ -f "$REGISTRANT" ]; then
            echo "OK: $REGISTRANT already present after 'flutter pub get'."
            exit 0
          fi

          echo "WARNING: $REGISTRANT was not generated by 'flutter pub get'."
          echo "Retrying: clearing plugin-tracking state and re-running 'flutter pub get'..."

          rm -f .flutter-plugins .flutter-plugins-dependencies
          rm -f "$REGISTRANT"
          flutter pub get

          if [ -f "$REGISTRANT" ]; then
            echo "OK: $REGISTRANT generated on retry."
            exit 0
          fi

          echo "ERROR: $REGISTRANT still missing after retry."
          echo "This file is required for the Xcode build to compile Runner."
          echo "This is a known flutter_tools plugin-injection bug, not a problem with this project's plugins or code."
          exit 1

      # 6. Generate launcher icons
      - name: Generate launcher icons
        working-directory: fridge_ai
        run: dart run flutter_launcher_icons

      # NOTE: There is deliberately no separate "pod install" step here.
      # `flutter build ios` below runs CocoaPods integration itself, at the
      # point where Flutter has fully finished writing
      # ios/Flutter/Generated.xcconfig and the plugin list CocoaPods reads
      # via `flutter_install_all_ios_pods` in the Podfile. Running
      # `pod install` manually as an earlier, separate step raced against
      # that and intermittently produced an incomplete Pods install (e.g.
      # missing path_provider_foundation), causing
      # "no such module 'path_provider_foundation'" in
      # GeneratedPluginRegistrant.swift even though `flutter pub get`
      # resolved the package correctly. Let `flutter build ios` own the
      # entire pod install step instead of pre-empting it.

      # 7. Build unsigned iOS application
      - name: Build unsigned iOS app
        working-directory: fridge_ai
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "Starting Flutter iOS build"
          echo "========================================"

          flutter build ios \
            --release \
            --no-codesign \
            -v \
            --dart-define=GROQ_API_KEY="$GROQ_API_KEY" \
            --dart-define=UNSPLASH_ACCESS_KEY="$UNSPLASH_ACCESS_KEY" \
            2>&1 | tee build_ios.log

          echo "========================================"
          echo "Flutter iOS build finished successfully"
          echo "========================================"

      # 8. Check that Runner.app was created
      - name: Check build output
        working-directory: fridge_ai
        run: |
          echo "Checking iOS build output..."

          ls -lah build/ios/iphoneos/

          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not created!"
            exit 1
          fi

          echo "Runner.app found successfully!"

      # 9. Create unsigned IPA
      - name: Package unsigned IPA
        working-directory: fridge_ai
        run: |
          set -e

          BUILD_DIR="build/ios/iphoneos"
          IPA_NAME="FridgeAI-unsigned.ipa"

          echo "Removing old Payload folder..."
          rm -rf "$BUILD_DIR/Payload"

          echo "Creating Payload folder..."
          mkdir -p "$BUILD_DIR/Payload"

          echo "Copying Runner.app..."
          cp -R \
            "$BUILD_DIR/Runner.app" \
            "$BUILD_DIR/Payload/Runner.app"

          echo "Creating IPA..."

          cd "$BUILD_DIR"

          rm -f "$IPA_NAME"

          zip -r -y \
            "$IPA_NAME" \
            Payload

          echo "========================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh "$IPA_NAME"

      # 10. Upload IPA to GitHub Actions artifacts
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FridgeAI-unsigned-ipa
          path: fridge_ai/build/ios/iphoneos/FridgeAI-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
