name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/flutter
            fridge_ai/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('fridge_ai/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: fridge_ai
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: fridge_ai
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: fridge_ai
        run: flutter analyze

      - name: Run tests
        working-directory: fridge_ai
        run: flutter test

      # Regenerate the Gradle wrapper jar using the system Gradle installed by
      # gradle/actions/setup-gradle above, right before the build. This makes
      # the build immune to the committed jar being missing, truncated, or
      # silently overwritten by an earlier tool step — `gradle wrapper`
      # rewrites gradlew, gradlew.bat, and gradle-wrapper.jar from a known-good
      # source every run, using the version pinned in gradle-wrapper.properties.
      - name: Regenerate Gradle wrapper
        working-directory: fridge_ai/android
        run: |
          gradle wrapper --gradle-version 8.14
          ls -la gradle/wrapper/
          test -s gradle/wrapper/gradle-wrapper.jar

      # The GROQ_API_KEY and UNSPLASH_ACCESS_KEY secrets are injected only as
      # build-time --dart-define values baked into the compiled app via
      # String.fromEnvironment. They are never echoed, printed, or written
      # to a file, so they never appear in the workflow logs.
      #
      # UNSPLASH_ACCESS_KEY is optional: if it isn't set as a repo secret,
      # this still builds fine — RecipeImageResolver just skips the network
      # photo lookup and every recipe uses its bundled local placeholder
      # image instead (see lib/services/recipe_image_resolver.dart). Add a
      # free Unsplash "Demo" Access Key at
      # https://unsplash.com/oauth/applications to get real recipe photos.
      - name: Build release APK
        working-directory: fridge_ai
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GROQ_API_KEY="$GROQ_API_KEY" \
            --dart-define=UNSPLASH_ACCESS_KEY="$UNSPLASH_ACCESS_KEY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FridgeAI-release-apk
          path: fridge_ai/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
