name: fridge_ai
description: "FridgeAI — an AI-powered food assistant that turns what's in your fridge into delicious recipes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Camera & images
  camera: ^0.11.4
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  image: ^4.2.0

  # Local storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Networking
  http: ^1.2.1

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.4.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # Swift Package Manager (SPM) is Flutter's new, still-maturing way of
  # resolving native iOS/macOS plugin dependencies, replacing CocoaPods. This
  # project's ios/Podfile still integrates plugins via CocoaPods while
  # Flutter simultaneously treats camera_avfoundation as a Swift Package,
  # and having both active for the same target confuses Xcode's module
  # resolution — the AVFoundation system framework ends up not visible the
  # way camera_avfoundation's Swift sources expect, producing "Type
  # 'AVCaptureSession' has no member ..." compiler errors even though that
  # code is valid, unmodified upstream Flutter code. Forcing everything
  # through the well-established CocoaPods path avoids the conflict. See:
  # https://docs.flutter.dev/packages-and-plugins/swift-package-manager/for-app-developers
  config:
    enable-swift-package-manager: false

  assets:
    - assets/images/
    - assets/icons/

# Generates Android + iOS launcher icons from a single 1024x1024 source
# image. Run with: flutter pub run flutter_launcher_icons
# (the CI workflows run this automatically before building).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#F3A468"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

# Pins the iOS camera implementation to a version whose Swift code no longer
# references AVCaptureSession.wasInterruptedNotification /
# runtimeErrorNotification the way 0.9.23+2 (pulled in by camera ^0.11.0+2)
# did. Newer Xcode/iOS SDKs on the CI runners no longer expose those as
# static members the same way, which broke the iOS build. Remove this
# override once the `camera` package's own constraint moves past 0.10.x.
dependency_overrides:
  camera_avfoundation: ^0.10.2
